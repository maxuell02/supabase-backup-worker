version: "3.8"

services:
  backup-worker:
    image: supabase-backup-worker:latest
    ports:
      - "3333:3333"
    volumes:
      - worker_data:/app/tmp
    environment:
      - PORT=3333
      - WORKER_AUTH_KEY=${WORKER_AUTH_KEY}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

volumes:
  worker_data:

services:
  backup-worker:
    build: .
    container_name: supabase-backup-worker
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - worker_data:/app/tmp
    environment:
      - PORT=3333
      - WORKER_AUTH_KEY=${WORKER_AUTH_KEY}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  worker_data:
